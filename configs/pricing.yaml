# Token prices and compute rates used by the cost meter.
#
# Anthropic: https://www.anthropic.com/pricing — captured 2026-08-25.
# OpenAI:    https://developers.openai.com/api/docs/pricing — captured 2026-08-25.
# USD per 1M tokens. Verified figures only; see `unverified` below for the rest.

usd_to_inr: 88.0        # ASSUMPTION, not a live rate. Restate on the day of the demo.

providers:
  anthropic:
    claude-opus-5:
      input: 5.00
      output: 25.00
      context: 1000000
    claude-sonnet-5:
      input: 3.00
      output: 15.00
      context: 1000000
      note: "intro pricing 2.00/10.00 through 2026-08-31"
    claude-haiku-4-5:
      input: 1.00
      output: 5.00
      context: 200000
  openai:
    gpt-5.6-sol:
      input: 4.00
      output: 20.00
      note: "promotional short-context rate, held at least to 2026-11-21"
    gpt-5.6-terra:
      input: 2.00
      output: 12.00
    gpt-5.6-luna:
      input: 0.20
      output: 1.20
    gpt-5.5:
      input: 5.00
      output: 30.00
    gpt-5.4:
      input: 2.50
      output: 15.00
    gpt-5.4-mini:
      input: 0.75
      output: 4.50
    gpt-5.4-nano:
      input: 0.20
      output: 1.25
    gpt-4o-mini:
      input: 0.15
      output: 0.60

# Prices we have not verified from a primary source. The meter refuses to use
# these silently — it marks any cost derived from them as unverified so a number
# in the demo can never look more solid than it is.
unverified: {}

# Tier 1 runs local classifiers, so its cost is compute time, not tokens.
# Priced off an assumed on-demand instance rate.
compute:
  tier1_inference:
    instance: "1x NVIDIA T4 equivalent, on-demand"
    inr_per_hour: 45.0    # ASSUMPTION
  tier0_rules:
    inr_per_hour: 0.0     # regex on the request thread, not separately billable
