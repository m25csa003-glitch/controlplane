use_case: decision_support
version: v2
description: Embedded in a regulated workflow. Output feeds a decision with legal weight.

latency_budget_ms: 3000          # correctness beats speed here
streaming_mode: buffered
risk_appetite: very_low

tiers:
  tier0:
    enabled: true
    checks: [pii, schema, cost_meter, policy_terms, acl_check]
  tier1:
    enabled: true
    checks: [grounding, safety, bias]
    uncertainty_band: [0.40, 0.90]   # wide band, escalate readily
    combine_sources: true   # 3 s budget; correctness beats speed here
  tier2:
    enabled: true
    models:                        # whichever provider has a key
      anthropic: claude-opus-5
      openai: gpt-5.6-sol
    effort: high
    samples: 1                     # self-consistency; each extra sample costs 1x latency and 1x spend
    max_escalation_rate: 0.20
    timeout_ms: 10000              # measured: luna ~1.3s, sol ~3.1s per call

thresholds:
  # Calibrated against eval/datasets/controlplane_eval_v1.jsonl with
  # unitary/toxic-bert: harmful cases scored 0.407-0.951, clean cases
  # peaked at 0.003. Anything in that gap separates cleanly; the three
  # policies sit at different points in it to preserve risk appetite.
  safety: 0.2
  bias: 0.55

costs:
  cost_of_being_wrong: 50000      # INR, assumed: regulatory exposure of one bad decision
  cost_of_human_review: 200       # INR, assumed: reviewer with domain expertise

max_regenerations: 2     # retries before a 'regenerate' verdict withholds instead

actions:
  pii_detected: block
  ungrounded_claim: escalate
  low_grounding_overall: escalate
  safety_violation: block
  bias_detected: escalate
  schema_violation: regenerate
  uncertain: escalate
  default: pass

audit:
  audit_sample_rate: 0.1   # share of PASSED responses also sent for review,
                            # so retuning has evidence about what it let through
  retention_days: 2555            # 7 years
  log_full_response: true
  hash_chain: strict

jurisdiction:
  primary: EU-AI-Act
  export_format: evidence_pack
