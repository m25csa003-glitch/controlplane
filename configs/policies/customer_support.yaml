use_case: customer_support
description: External-facing support assistant. Users are customers, not employees.

latency_budget_ms: 300          # hard ceiling for added latency on the clean path
streaming_mode: buffered        # hold one sentence back until verified
risk_appetite: low

tiers:
  tier0:
    enabled: true
    checks: [pii, schema, cost_meter, policy_terms]
  tier1:
    enabled: true
    checks: [grounding, safety, bias]
    uncertainty_band: [0.25, 0.75]   # outside this band, decide without tier 2
  tier2:
    enabled: true
    max_escalation_rate: 0.05        # conformal target, tuned on the calibration set
    timeout_ms: 800

costs:
  cost_of_being_wrong: 400        # INR, assumed: refund + handling of one bad answer
  cost_of_human_review: 25        # INR, assumed: agent minute rate

actions:
  pii_detected: block
  ungrounded_claim: redact_span
  low_grounding_overall: regenerate
  safety_violation: block
  uncertain: escalate
  default: pass

audit:
  retention_days: 365
  log_full_response: true
