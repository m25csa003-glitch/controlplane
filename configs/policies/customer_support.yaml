use_case: customer_support
version: v2
description: External-facing support assistant. Users are customers, not employees.

latency_budget_ms: 300          # hard ceiling for added latency on the clean path
streaming_mode: buffered        # hold one sentence back until verified
risk_appetite: low

tiers:
  tier0:
    enabled: true
    checks: [pii, schema, cost_meter, policy_terms, acl_check]
  tier1:
    enabled: true
    checks: [grounding, safety, bias]
    uncertainty_band: [0.25, 0.75]   # outside this band, decide without tier 2
  tier2:
    enabled: true
    model: claude-haiku-4-5
    effort: low
    samples: 1
    max_escalation_rate: 0.05        # conformal target, tuned on the calibration set
    timeout_ms: 800

thresholds:
  # Calibrated against eval/datasets/controlplane_eval_v1.jsonl with
  # unitary/toxic-bert: harmful cases scored 0.407-0.951, clean cases
  # peaked at 0.003. Anything in that gap separates cleanly; the three
  # policies sit at different points in it to preserve risk appetite.
  safety: 0.3
  bias: 0.7

costs:
  cost_of_being_wrong: 400        # INR, assumed: refund + handling of one bad answer
  cost_of_human_review: 25        # INR, assumed: agent minute rate

actions:
  pii_detected: block
  ungrounded_claim: redact_span
  low_grounding_overall: regenerate
  safety_violation: block
  bias_detected: escalate
  schema_violation: regenerate
  uncertain: escalate
  default: pass

audit:
  retention_days: 365
  log_full_response: true

jurisdiction:
  primary: IN-DPDP
  export_format: evidence_pack
