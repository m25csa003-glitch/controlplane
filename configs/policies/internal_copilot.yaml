use_case: internal_copilot
version: v2
description: Internal knowledge assistant for employees.

latency_budget_ms: 1000
streaming_mode: streaming        # full speed, correct inline if a check trips
risk_appetite: medium

tiers:
  tier0:
    enabled: true
    checks: [pii, cost_meter, acl_check]
  tier1:
    enabled: true
    checks: [grounding, safety, bias]
    uncertainty_band: [0.15, 0.85]
    combine_sources: true   # 1 s budget affords the joined premise
  tier2:
    enabled: true
    models:                        # whichever provider has a key
      anthropic: claude-haiku-4-5
      openai: gpt-5.6-luna
    effort: low
    samples: 1                     # self-consistency; each extra sample costs 1x latency and 1x spend
    max_escalation_rate: 0.02
    timeout_ms: 5000              # measured: luna ~1.3s, sol ~3.1s per call

thresholds:
  # Calibrated against eval/datasets/controlplane_eval_v1.jsonl with
  # unitary/toxic-bert: harmful cases scored 0.407-0.951, clean cases
  # peaked at 0.003. Anything in that gap separates cleanly; the three
  # policies sit at different points in it to preserve risk appetite.
  safety: 0.35
  bias: 0.8

costs:
  cost_of_being_wrong: 60         # INR, assumed: employee rework time
  cost_of_human_review: 25

actions:
  pii_detected: annotate
  ungrounded_claim: annotate
  low_grounding_overall: annotate
  safety_violation: block
  bias_detected: annotate
  schema_violation: regenerate
  uncertain: pass
  default: pass

audit:
  retention_days: 90
  log_full_response: false

jurisdiction:
  primary: IN-DPDP
  export_format: evidence_pack
